<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpportunityLens AI — Eligibility Auditor (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --base-950:#0b1120; --base-900:#0f172a; --base-850:#141c30; --base-800:#1a2540;
    --base-700:#243254; --base-600:#334469;
    --emerald:#10b981; --amber:#f59e0b; --rose:#f43f5e; --indigo:#6366f1;
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
    --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--base-900); color:var(--slate-100);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:rgba(99,102,241,.35); }
  * { scrollbar-width:thin; scrollbar-color:#334469 #0f172a; }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:#0f172a; }
  *::-webkit-scrollbar-thumb{ background-color:#334469; border-radius:8px; }

  #root{ min-height:100vh; background-image:
      radial-gradient(circle at 20% 20%, rgba(99,102,241,.08), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(16,185,129,.06), transparent 35%);
  }

  .wrap{ max-width:1152px; margin:0 auto; padding:0 16px; }
  @media(min-width:640px){ .wrap{ padding:0 24px; } }

  header.topbar{
    position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(36,50,84,.8);
    background:rgba(15,23,42,.8); backdrop-filter:blur(12px);
  }
  header.topbar .inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:36px;height:36px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--indigo),var(--emerald));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 40px -10px rgba(99,102,241,.35);
  }
  .brand h1{ font-size:15px; font-weight:700; color:var(--slate-50); margin:0; line-height:1.2; }
  .brand p{ font-size:11px; color:var(--slate-500); margin:0; line-height:1.2; }

  .btn-ghost{
    display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--slate-400);
    background:transparent; border:1px solid var(--base-700); border-radius:8px; padding:6px 12px;
    cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{ color:var(--slate-100); border-color:var(--base-600); }

  .content{ padding:32px 0; }

  .hero{ margin-bottom:32px; max-width:640px; }
  .hero h2{ font-size:26px; font-weight:700; color:var(--slate-50); margin:0 0 8px; }
  @media(min-width:640px){ .hero h2{ font-size:30px; } }
  .hero p{ color:var(--slate-400); font-size:14px; margin:0; }
  @media(min-width:640px){ .hero p{ font-size:16px; } }

  .glass-panel{
    background:linear-gradient(180deg, rgba(26,37,64,.6) 0%, rgba(15,23,42,.6) 100%);
    backdrop-filter:blur(12px);
    border:1px solid rgba(148,163,184,.08);
    border-radius:16px;
  }

  .preset-label{ display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:var(--slate-400); }
  .preset-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:24px; }
  @media(min-width:640px){ .preset-grid{ grid-template-columns:repeat(3,1fr); } }
  .preset-card{
    text-align:left; padding:14px; border-radius:12px; border:1px solid var(--base-700);
    background:var(--base-850); cursor:pointer; transition:.2s; font-family:inherit;
  }
  .preset-card:hover{ border-color:rgba(99,102,241,.5); background:rgba(99,102,241,.05); }
  .preset-card.active{ border-color:var(--indigo); background:rgba(99,102,241,.1); box-shadow:0 0 40px -10px rgba(99,102,241,.35); }
  .preset-card p.title{ font-size:13px; font-weight:500; color:var(--slate-100); margin:0; }
  .preset-card p.desc{ font-size:12px; color:var(--slate-400); margin:4px 0 0; }

  .input-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:24px; }
  @media(min-width:1024px){ .input-grid{ grid-template-columns:1fr 1fr; } }

  .panel-head{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .panel-icon{ width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center; }
  .panel-icon.cand{ background:rgba(99,102,241,.15); color:var(--indigo); }
  .panel-icon.opp{ background:rgba(16,185,129,.15); color:var(--emerald); }
  .panel-head h3{ font-size:14px; font-weight:600; color:var(--slate-100); margin:0; }

  .tabs{ display:inline-flex; gap:4px; margin-bottom:16px; padding:4px; background:rgba(11,17,32,.6); border-radius:8px; width:fit-content; }
  .tab-btn{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:500;
    background:transparent; border:none; color:var(--slate-400); cursor:pointer; font-family:inherit; transition:.15s;
  }
  .tab-btn.active{ background:var(--base-700); color:var(--slate-100); }
  .tab-btn:hover:not(.active){ color:var(--slate-200); }

  textarea.field{
    flex:1; min-height:180px; width:100%; resize:vertical; background:rgba(11,17,32,.5);
    border:1px solid var(--base-700); border-radius:12px; padding:14px; font-size:13px; color:var(--slate-100);
    font-family:inherit; transition:.15s;
  }
  textarea.field::placeholder{ color:var(--slate-500); }
  textarea.field:focus{ outline:none; border-color:rgba(99,102,241,.5); box-shadow:0 0 0 2px rgba(99,102,241,.35); }

  .dropzone{
    flex:1; min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; border-radius:12px; border:2px dashed var(--base-700); cursor:pointer; transition:.15s; padding:16px; text-align:center;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--indigo); background:rgba(99,102,241,.05); }
  .dropzone .fname{ display:flex; align-items:center; gap:8px; background:var(--base-800); padding:8px 12px; border-radius:8px; }
  .dropzone .fname span{ font-size:12px; color:var(--slate-200); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dropzone .fname button{ background:none; border:none; color:var(--slate-500); cursor:pointer; display:flex; }
  .dropzone .fname button:hover{ color:var(--rose); }
  .dz-hint{ font-size:12px; color:var(--slate-400); }
  .dz-sub{ font-size:11px; color:var(--slate-600); }

  .url-row{
    display:flex; align-items:center; gap:8px; background:rgba(11,17,32,.5); border:1px solid var(--base-700);
    border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .url-row input{ flex:1; background:transparent; border:none; color:var(--slate-100); font-size:13px; font-family:inherit; }
  .url-row input::placeholder{ color:var(--slate-500); }
  .url-row input:focus{ outline:none; }
  .url-row.focus{ border-color:rgba(99,102,241,.5); box-shadow:0 0 0 2px rgba(99,102,241,.35); }
  .url-note{ font-size:11px; color:var(--slate-500); margin:0 0 8px 4px; }

  .analyze-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .analyze-btn{
    display:flex; align-items:center; gap:8px; background:var(--indigo); color:#fff; font-weight:600; font-size:14px;
    padding:12px 24px; border-radius:12px; border:none; cursor:pointer; transition:.15s;
    box-shadow:0 0 40px -10px rgba(99,102,241,.35);
    font-family:inherit;
  }
  .analyze-btn:hover:not(:disabled){ background:#5457e5; }
  .analyze-btn:disabled{ background:var(--base-700); cursor:not-allowed; box-shadow:none; color:var(--slate-400); }
  .analyze-hint{ font-size:12px; color:var(--base-600); }

  .error-box{
    margin-top:20px; display:flex; align-items:flex-start; gap:10px; background:rgba(244,63,94,.1);
    border:1px solid rgba(244,63,94,.3); border-radius:12px; padding:14px 16px; max-width:640px; margin-left:auto; margin-right:auto;
    animation:fadeUp .25s ease-out;
  }
  .error-box p{ font-size:13px; color:#fda4af; margin:0; }
  .error-box svg{ color:#fb7185; flex-shrink:0; margin-top:2px; }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes shimmer{ 0%{ background-position:-1000px 0; } 100%{ background-position:1000px 0; } }
  @keyframes popIn{ from{ opacity:0; transform:scale(.8); } to{ opacity:1; transform:scale(1); } }
  @keyframes slideRow{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  .fade-section{ animation:riseIn .4s ease-out; }

  .shimmer{
    background:#1a2540;
    background-image:linear-gradient(90deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.08) 20%, rgba(255,255,255,.02) 40%);
    background-size:1000px 100%;
    animation:shimmer 2s infinite linear;
    border-radius:10px;
  }
  .skel-wrap > .glass-panel{ padding:24px; margin-bottom:20px; }
  .skel-top{ display:flex; align-items:center; gap:24px; }
  .skel-circle{ width:112px;height:112px;border-radius:50%; flex-shrink:0; }
  .skel-lines{ flex:1; display:flex; flex-direction:column; gap:12px; }

  /* result dashboard */
  .result-head{ display:flex; flex-direction:column; gap:24px; align-items:flex-start; padding:24px; margin-bottom:20px; }
  @media(min-width:768px){ .result-head{ flex-direction:row; align-items:center; } }
  .gauge-wrap{ position:relative; flex-shrink:0; width:128px; height:128px; }
  .gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-score{ font-size:24px; font-weight:700; color:var(--slate-50); }
  .gauge-label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate-500); }

  .verdict-badge{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid;
  }
  .verdict-eligible{ color:#34d399; background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.4); }
  .verdict-borderline{ color:#fbbf24; background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.4); }
  .verdict-ineligible{ color:#fb7185; background:rgba(244,63,94,.1); border-color:rgba(244,63,94,.4); }

  .confidence-tag{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--slate-500); }
  .summ-grid{ display:grid; grid-template-columns:1fr; gap:16px; padding-top:4px; }
  @media(min-width:640px){ .summ-grid{ grid-template-columns:1fr 1fr; } }
  .summ-label{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; margin-bottom:4px; }
  .summ-label.cand{ color:var(--indigo); }
  .summ-label.opp{ color:var(--emerald); }
  .summ-text{ font-size:13px; color:var(--slate-400); line-height:1.6; margin:0; }

  .dash-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:20px; align-items:start; }
  @media(min-width:1024px){ .dash-grid{ grid-template-columns:3fr 2fr; } }

  .section-title{ display:flex; align-items:center; gap:8px; margin-bottom:20px; }
  .section-title h3{ font-size:14px; font-weight:600; color:var(--slate-100); margin:0; }
  .section-title svg{ color:var(--indigo); }
  .section-title small{ font-size:11px; color:var(--slate-500); margin-left:4px; font-weight:400; }

  table.matrix{ width:100%; font-size:13px; border-collapse:collapse; }
  table.matrix thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--slate-500);
    border-bottom:1px solid var(--base-700); padding-bottom:10px; font-weight:500;
  }
  table.matrix td{ padding:14px 12px 14px 0; border-bottom:1px solid rgba(26,37,64,.7); vertical-align:top; }
  table.matrix tr:last-child td{ border-bottom:none; }
  table.matrix td.crit{ font-weight:500; color:var(--slate-100); max-width:160px; }
  table.matrix td.req{ color:var(--slate-400); max-width:200px; }
  table.matrix td.ev{ color:var(--slate-400); max-width:340px; }
  table.matrix td.ev p.quote{ color:var(--slate-300); font-style:italic; margin:0 0 4px; }
  table.matrix td.ev p.expl{ margin:0; }
  .matrix-mobile{ display:none; }
  @media(max-width:767px){
    table.matrix{ display:none; }
    .matrix-mobile{ display:block; }
  }
  .m-card{ border-radius:12px; border:1px solid var(--base-700); background:rgba(20,28,48,.6); padding:14px; margin-bottom:12px; animation:slideRow .3s ease-out both; }
  .m-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .m-card-top span.crit{ font-weight:500; color:var(--slate-100); font-size:13px; }
  .m-req{ font-size:12px; color:var(--slate-500); margin:0 0 6px; }
  .m-req b{ color:var(--slate-400); font-weight:400; }
  .m-quote{ font-size:12px; color:var(--slate-300); font-style:italic; margin:0 0 4px; }
  .m-expl{ font-size:12px; color:var(--slate-400); margin:0; }

  .status-pill{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11px; font-weight:500;
    border:1px solid; white-space:nowrap;
  }
  .status-met{ color:#34d399; background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.3); }
  .status-unmet{ color:#fb7185; background:rgba(244,63,94,.1); border-color:rgba(244,63,94,.3); }
  .status-uncertain{ color:#fbbf24; background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.3); }

  .radar-legend{ display:flex; align-items:center; gap:16px; justify-content:center; margin-top:8px; font-size:11px; color:var(--slate-500); }
  .radar-legend span{ display:flex; align-items:center; gap:4px; }
  .dot{ width:8px;height:8px;border-radius:50%; }

  .split-grid{ display:grid; grid-template-columns:1fr; gap:20px; }
  @media(min-width:768px){ .split-grid{ grid-template-columns:1fr 1fr; } }
  .strengths-title{ display:flex; align-items:center; gap:8px; margin-bottom:8px; color:#34d399; }
  .gaps-title{ display:flex; align-items:center; gap:8px; margin-bottom:8px; color:#fb7185; }
  .strengths-title h3, .gaps-title h3{ font-size:13px; font-weight:600; margin:0; }
  ul.checklist{ list-style:none; margin:0; padding:0; }
  ul.checklist li{ border-top:1px solid rgba(26,37,64,.6); }
  ul.checklist li:first-child{ border-top:none; }
  .check-item{ display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:8px; cursor:pointer; font-size:13px; transition:.15s; }
  .check-item:hover{ background:rgba(26,37,64,.6); }
  .check-box{ margin-top:2px; width:16px;height:16px;border-radius:4px; flex-shrink:0; border:1px solid var(--base-600); display:flex; align-items:center; justify-content:center; transition:.15s; }
  .check-box.on.strength{ background:var(--emerald); border-color:var(--emerald); }
  .check-box.on.gap{ background:var(--rose); border-color:var(--rose); }
  .check-text{ line-height:1.4; color:var(--slate-300); }
  .check-text.on{ color:var(--slate-500); text-decoration:line-through; }

  .roadmap-title{ font-size:13px; font-weight:600; color:var(--slate-100); margin:0 0 16px; }
  .roadmap-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:768px){ .roadmap-grid{ grid-template-columns:repeat(3,1fr); } }
  .roadmap-col{ background:rgba(11,17,32,.4); border-radius:12px; border:1px solid var(--base-800); padding:14px; }
  .roadmap-head{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--indigo); margin-bottom:12px; }
  .roadmap-item{ background:rgba(20,28,48,.8); border-radius:8px; padding:10px; border:1px solid var(--base-800); margin-bottom:10px; animation:slideRow .3s ease-out both; }
  .roadmap-item p{ font-size:12px; color:var(--slate-300); line-height:1.4; margin:0 0 8px; }
  .impact-tag{ display:inline-block; font-size:10px; font-weight:500; padding:2px 8px; border-radius:999px; border:1px solid; }
  .impact-high{ color:#fda4af; background:rgba(244,63,94,.1); border-color:rgba(244,63,94,.3); }
  .impact-medium{ color:#fcd34d; background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.3); }
  .impact-low{ color:var(--slate-300); background:rgba(100,116,139,.1); border-color:rgba(100,116,139,.3); }
  .no-items{ font-size:12px; color:var(--base-600); font-style:italic; margin:0; }

  .pitch-panel{ border-color:rgba(99,102,241,.2); overflow:hidden; }
  .pitch-head{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:20px; background:none; border:none; cursor:pointer; font-family:inherit; color:inherit; }
  .pitch-head .left{ display:flex; align-items:center; gap:8px; }
  .pitch-head h3{ font-size:14px; font-weight:600; color:var(--slate-100); margin:0; }
  .pitch-icon-box{ width:32px;height:32px;border-radius:8px;background:rgba(99,102,241,.15); color:var(--indigo); display:flex; align-items:center; justify-content:center; }
  .chevron{ transition:transform .2s; color:var(--slate-500); }
  .chevron.open{ transform:rotate(180deg); }
  .pitch-body{ padding:0 20px 20px; }
  .pitch-box{ background:rgba(99,102,241,.05); border:1px solid rgba(99,102,241,.2); border-radius:12px; padding:16px; position:relative; }
  .pitch-box p{ font-size:13px; color:var(--slate-200); line-height:1.7; font-style:italic; margin:0; padding-right:28px; }
  .copy-btn{ position:absolute; top:12px; right:12px; background:none; border:none; color:var(--slate-400); cursor:pointer; display:flex; }
  .copy-btn:hover{ color:var(--indigo); }
  .copy-btn.copied{ color:#34d399; }
  .pitch-foot{ font-size:11px; color:var(--slate-500); margin:10px 4px 0; }

  .disclaimer{
    display:flex; align-items:flex-start; gap:8px; font-size:11px; color:var(--slate-500);
    background:rgba(245,158,11,.06); border:1px solid rgba(245,158,11,.2); border-radius:10px; padding:10px 12px; margin-bottom:20px;
  }
  .disclaimer svg{ color:#fbbf24; flex-shrink:0; margin-top:1px; }

  footer.appfoot{ max-width:1152px; margin:0 auto; padding:32px 16px; text-align:center; font-size:11px; color:var(--base-600); }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================== ICONS ============================== */
function icon(name, size){
  size = size || 16;
  const s = 'width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const paths = {
    sparkles: '<path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>',
    search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    'alert-triangle': '<path d="M12 3l10 18H2L12 3z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17.3" r=".4" fill="currentColor"/>',
    'rotate-ccw': '<path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/>',
    briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    'file-text': '<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>',
    upload: '<path d="M12 16V4"/><polyline points="6 9 12 3 18 9"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',

/* ============================== HEURISTIC FREEFORM ANALYZER ============================== */
function extractGPA(text){
  const m = text.match(/(\d\.\d{1,2})\s*\/?\s*(?:out of\s*)?4\.0?\s*gpa|gpa[:\s]*(\d\.\d{1,2})|(\d\.\d{1,2})\s*gpa/i);
  if(!m) return null;
  return parseFloat(m[1]||m[2]||m[3]);
}
function extractMinGPA(text){
  const m = text.match(/minimum\s*(\d\.\d{1,2})\s*gpa|(\d\.\d{1,2})\+?\s*gpa\s*(?:minimum|required|or higher)?/i);
  if(!m) return null;
  return parseFloat(m[1]||m[2]);
}
function hasAny(text, words){
  const t = text.toLowerCase();
  return words.some(w=>t.includes(w));
}
function findLevel(text){
  const levels = ["freshman","sophomore","junior","senior","graduate student","undergraduate","postgraduate","phd","doctoral","high school"];
  const t = text.toLowerCase();
  return levels.find(l=>t.includes(l)) || null;
}
const SKILLS = ["python","java","javascript","typescript","react","node","c++","c#","sql","html","css","swift","kotlin","go","rust","pytorch","tensorflow","excel","figma","photoshop","public speaking","research","leadership"];
function findSkills(text){
  const t = text.toLowerCase();
  return SKILLS.filter(s=>t.includes(s));
}
function snippet(text, around, len){
  len = len || 90;
  const idx = text.toLowerCase().indexOf(around.toLowerCase());
  if(idx===-1) return null;
  const start = Math.max(0, idx-20);
  return (start>0?"…":"") + text.slice(start, start+len).trim() + "…";
}

function analyzeFreeform(candidateText, opportunityText){
  const rows = [];
  const oppT = opportunityText || "";
  const candT = candidateText || "";

  // GPA
  const minGpa = extractMinGPA(oppT);
  if(minGpa !== null){
    const candGpa = extractGPA(candT);
    let status = "Uncertain", evq = "No direct evidence found.";
    if(candGpa !== null){
      status = candGpa >= minGpa ? "Met" : "Unmet";
      evq = "Candidate GPA reads as " + candGpa.toFixed(1) + ".";
    }
    rows.push({ criterion:"GPA / Academic Standing", required:"Minimum "+minGpa.toFixed(1)+" GPA", candidate_status:status, evidence_quote:evq, explanation: status==="Met" ? "Stated GPA clears the minimum." : status==="Unmet" ? "Stated GPA falls below the stated minimum." : "No GPA figure was found in the candidate profile." });
  }

  // Citizenship / work auth
  if(hasAny(oppT, ["citizen","permanent resident","work authorization","visa sponsorship","authorized to work"])){
    let status="Uncertain", evq="No direct evidence found.";
    if(hasAny(candT, ["u.s. citizen","us citizen","citizen"])){ status="Met"; evq = snippet(candT,"citizen") || "Candidate profile mentions citizenship."; }
    else if(hasAny(candT, ["permanent resident"])){ status="Met"; evq = snippet(candT,"permanent resident") || "Candidate mentions permanent residency."; }
    else if(hasAny(candT, ["international student","visa","sponsorship needed","outside the united states","outside the us"])){ status="Uncertain"; evq = snippet(candT,"international") || snippet(candT,"visa") || "Candidate profile suggests residency outside the opportunity's likely home country."; }
    rows.push({ criterion:"Citizenship / Work Authorization", required:"Meets the stated citizenship or work-authorization requirement", candidate_status:status, evidence_quote:evq, explanation: status==="Met" ? "Candidate profile states a status that satisfies this gate." : "Profile doesn't clearly confirm citizenship or work-authorization status." });
  }

  // Enrollment level / degree
  const oppLevel = findLevel(oppT);
  const candLevel = findLevel(candT);
  if(oppLevel){
    let status="Uncertain", evq = "No direct evidence found.";
    if(candLevel){
      status = candLevel===oppLevel ? "Met" : "Uncertain";
      evq = "Candidate profile mentions: \"" + candLevel + "\".";
    }
    rows.push({ criterion:"Enrollment Level / Degree Stage", required:"Candidate should be at the '"+oppLevel+"' stage (or equivalent)", candidate_status:status, evidence_quote:evq, explanation: status==="Met" ? "Candidate's stated level matches what's required." : "Candidate's academic stage isn't a confirmed match for what's required." });
  }

  // Age
  const ageReqM = oppT.match(/age[d]?\s*(\d{1,2})\s*\+|(\d{1,2})\+\s*years?\s*old|minimum age\s*(?:of\s*)?(\d{1,2})/i);
  if(ageReqM){
    const req = parseInt(ageReqM[1]||ageReqM[2]||ageReqM[3],10);
    const candAgeM = candT.match(/(\d{1,2})\s*years?\s*old|age[:\s]*(\d{1,2})/i);
    let status="Uncertain", evq="No direct evidence found.";
    if(candAgeM){
      const candAge = parseInt(candAgeM[1]||candAgeM[2],10);
      status = candAge >= req ? "Met" : "Unmet";
      evq = "Candidate age reads as " + candAge + ".";
    }
    rows.push({ criterion:"Age Requirement", required:"At least "+req+" years old", candidate_status:status, evidence_quote:evq, explanation: status==="Met" ? "Candidate meets or exceeds the minimum age." : status==="Unmet" ? "Candidate is below the minimum age." : "No age figure found in the candidate profile." });
  }

  // Experience
  if(hasAny(oppT, ["experience","internship","project experience"])){
    let status="Uncertain", evq="No direct evidence found.";
    const expM = candT.match(/(\d+)\+?\s*years?\s*(of\s*)?(experience|contribut)/i);
    if(expM){ status="Met"; evq = "Candidate profile mentions " + expM[1] + "+ years of relevant experience."; }
    else if(hasAny(candT, ["internship","freelance","open-source","open source","portfolio","project"])){ status="Met"; evq = snippet(candT,"project") || snippet(candT,"internship") || snippet(candT,"freelance") || "Candidate mentions relevant project or work history."; }
    else if(hasAny(candT, ["no prior internship","no internship","no experience"])){ status="Unmet"; evq = "Candidate explicitly notes a lack of prior internship or work experience."; }
    rows.push({ criterion:"Relevant Experience", required:"Prior project, internship, or work experience", candidate_status:status, evidence_quote:evq, explanation: status==="Met" ? "Candidate profile shows tangible relevant experience." : status==="Unmet" ? "Candidate explicitly lacks the kind of experience typically expected here." : "No clear evidence of relevant experience was found." });
  }

  // Skills
  const candSkills = findSkills(candT);
  const oppSkills = findSkills(oppT);
  if(oppSkills.length){
    const overlap = oppSkills.filter(s=>candSkills.includes(s));
    const status = overlap.length === oppSkills.length ? "Met" : overlap.length > 0 ? "Uncertain" : "Unmet";
    rows.push({ criterion:"Technical Skills", required:"Proficiency in: "+oppSkills.join(", "), candidate_status: status, evidence_quote: candSkills.length ? "Candidate profile mentions: "+candSkills.join(", ")+"." : "No direct evidence found.", explanation: status==="Met" ? "All named skills appear in the candidate profile." : status==="Unmet" ? "None of the named skills appear in the candidate profile." : "Some, but not all, of the named skills appear in the candidate profile." });
  }

  if(rows.length === 0){
    rows.push({ criterion:"General Fit", required:"Explicit eligibility criteria in the opportunity text", candidate_status:"Uncertain", evidence_quote:"No direct evidence found.", explanation:"No clearly structured eligibility gates (GPA, citizenship, age, skills, experience) could be automatically detected in the pasted text — try pasting a more detailed opportunity description, or use a demo preset." });
  }

  const scoreMap = { Met:100, Uncertain:50, Unmet:0 };
  const matchScore = Math.round(rows.reduce((a,r)=>a+scoreMap[r.candidate_status],0) / rows.length);
  const detectedCount = rows.filter(r=>r.evidence_quote !== "No direct evidence found.").length;
  const confidence = Math.max(35, Math.min(75, Math.round(35 + (detectedCount/rows.length)*40)));

  let verdict = "Borderline / High Potential";
  if(matchScore >= 75) verdict = "Eligible";
  else if(matchScore < 35) verdict = "Ineligible";

  const strengths = rows.filter(r=>r.candidate_status==="Met").map(r=>r.criterion+": "+r.explanation);
  const gaps = rows.filter(r=>r.candidate_status!=="Met").map(r=>r.criterion+": "+r.explanation);
  if(strengths.length===0) strengths.push("Not enough matched criteria were detected to list a clear strength yet — consider adding more detail to the candidate profile.");
  if(gaps.length===0) gaps.push("No clear gaps were detected from the text provided.");

  const timeframes = ["Immediate (1-7 Days)","Short-term (1 Month)","Long-term"];
  const recommendations = rows.filter(r=>r.candidate_status!=="Met").map((r,i)=>({
    timeframe: timeframes[i % timeframes.length],
    action_item: "Address the '"+r.criterion+"' gap: gather or add clear evidence of \""+r.required+"\" to the profile, or work toward meeting it directly.",
    impact: r.candidate_status==="Unmet" ? "High" : "Medium"
  }));
  if(recommendations.length===0){
    recommendations.push({ timeframe:"Immediate (1-7 Days)", action_item:"Profile looks strong against the detected criteria — move forward with the application.", impact:"Low" });
  }

  const topStrengthCriterion = rows.find(r=>r.candidate_status==="Met");
  const angle = topStrengthCriterion
    ? "Lead with the strongest matching point — " + topStrengthCriterion.criterion.toLowerCase() + " — and connect it directly to specific language from the opportunity description to make the fit obvious to a reviewer."
    : "Since few criteria were clearly matched from the text provided, focus the application on any transferable strengths not yet reflected in the pasted profile, and consider reaching out to the opportunity organizer with direct questions about ambiguous requirements.";

  return {
    candidate_summary: candT.trim() ? (candT.trim().slice(0,220) + (candT.trim().length>220 ? "…" : "")) : "No candidate profile text was provided.",
    opportunity_summary: oppT.trim() ? (oppT.trim().slice(0,220) + (oppT.trim().length>220 ? "…" : "")) : "No opportunity description text was provided.",
    overall_verdict: verdict,
    match_score: matchScore,
    confidence_score: confidence,

/* ============================== MATCH GAUGE SVG ============================== */
function gaugeSVG(score, verdict, size){
  size = size || 128;
  const stroke = 10;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, score));
  const offset = c - (clamped/100) * c;
  const color = verdictRing(verdict);
  return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#1a2540" stroke-width="'+stroke+'"/>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" ' +
      'stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" style="animation:gaugeFill 1.1s ease-out forwards; --gauge-offset:'+offset+';"/>' +
    '</svg>';
}

/* ============================== RADAR CHART SVG ============================== */
function radarSVG(breakdown){
  if(breakdown.length < 3) return "";
  const size = 300, cx = size/2, cy = size/2, R = 105;
  const n = breakdown.length;
  const scoreOf = s => s==="Met" ? 100 : s==="Uncertain" ? 50 : 0;
  const pts = breakdown.map((row,i)=>{
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    const val = scoreOf(row.candidate_status)/100;
    return { x: cx + Math.cos(ang)*R*val, y: cy + Math.sin(ang)*R*val, lx: cx + Math.cos(ang)*(R+22), ly: cy + Math.sin(ang)*(R+22), ang };
  });
  const gridLevels = [0.33,0.66,1];
  let grid = "";
  gridLevels.forEach(lvl=>{
    let poly = [];
    for(let i=0;i<n;i++){
      const ang = (Math.PI*2*i/n) - Math.PI/2;
      poly.push((cx+Math.cos(ang)*R*lvl)+","+(cy+Math.sin(ang)*R*lvl));
    }
    grid += '<polygon points="'+poly.join(" ")+'" fill="none" stroke="#243254" stroke-width="1"/>';
  });
  let axes = "";
  for(let i=0;i<n;i++){
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    axes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(ang)*R)+'" y2="'+(cy+Math.sin(ang)*R)+'" stroke="#243254" stroke-width="1"/>';
  }
  const polyPts = pts.map(p=>p.x+","+p.y).join(" ");
  let labels = "";
  pts.forEach((p,i)=>{
    const label = breakdown[i].criterion.length > 16 ? breakdown[i].criterion.slice(0,15)+"…" : breakdown[i].criterion;
    let anchor = "middle";
    if(p.lx > cx + 10) anchor = "start";
    else if(p.lx < cx - 10) anchor = "end";
    labels += '<text x="'+p.lx+'" y="'+p.ly+'" fill="#94a3b8" font-size="10.5" text-anchor="'+anchor+'" font-family="Inter, sans-serif">'+escapeHtml(label)+'<title>'+escapeHtml(breakdown[i].criterion)+"</title></text>";
  });
  const dots = pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#6366f1"/>').join("");
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="100%">' + grid + axes +
    '<polygon points="'+polyPts+'" fill="#6366f1" fill-opacity="0.35" stroke="#6366f1" stroke-width="2"/>' +
    dots + labels + '</svg>';
}

/* ============================== EVENT HANDLERS ============================== */
function attachHandlers(){
  const resetBtn = document.getElementById('btnReset');
  if(resetBtn) resetBtn.onclick = ()=>{ state.report=null; state.error=null; render(); };

  document.querySelectorAll('.preset-card').forEach(btn=>{
    btn.onclick = ()=>{
      const preset = DEMO_PRESETS.find(p=>p.id===btn.dataset.preset);
      state.activePresetId = preset.id;
      state.candidateText = preset.candidateText;
      state.candidateFileName = null;
      state.candidateMode = "text";
      state.opportunityText = preset.opportunityText;
      state.opportunityFileName = null;
      state.opportunityUrl = "";
      state.opportunityMode = "text";
      state.error = null;
      render();
    };
  });

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const kind = btn.dataset.kind, mode = btn.dataset.mode;
      if(kind==="candidate") state.candidateMode = mode; else state.opportunityMode = mode;
      render();
    };
  });

  ['candidate','opportunity'].forEach(kind=>{
    const ta = document.getElementById('ta-'+kind);
    if(ta) ta.oninput = (e)=>{
      if(kind==="candidate") state.candidateText = e.target.value; else state.opportunityText = e.target.value;
      if(state.activePresetId){ state.activePresetId = null; }
      updateAnalyzeButton();
    };
    const fi = document.getElementById('fi-'+kind);
    const dz = document.getElementById('dz-'+kind);
    if(dz){
      dz.onclick = ()=>{ if(fi) fi.click(); };
      dz.ondragover = (e)=>{ e.preventDefault(); dz.classList.add('drag'); };
      dz.ondragleave = ()=> dz.classList.remove('drag');
      dz.ondrop = (e)=>{
        e.preventDefault(); dz.classList.remove('drag');
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if(f) setFile(kind, f);
      };
    }
    if(fi) fi.onchange = (e)=>{ const f = e.target.files[0]; if(f) setFile(kind, f); };
    const rm = document.getElementById('rmfile-'+kind);
    if(rm) rm.onclick = (e)=>{ e.stopPropagation(); if(kind==="candidate") state.candidateFileName=null; else state.opportunityFileName=null; render(); };
  });

  const taExtra = document.getElementById('ta-opportunity-url-extra');
  if(taExtra) taExtra.oninput = (e)=>{ state.opportunityText = e.target.value; if(state.activePresetId) state.activePresetId=null; updateAnalyzeButton(); };
  const urlIn = document.getElementById('in-url');
  if(urlIn){
    urlIn.oninput = (e)=>{ state.opportunityUrl = e.target.value; if(state.activePresetId) state.activePresetId=null; updateAnalyzeButton(); };
    urlIn.onfocus = ()=> document.getElementById('urlrow').classList.add('focus');
    urlIn.onblur = ()=> document.getElementById('urlrow').classList.remove('focus');
  }

  const analyzeBtn = document.getElementById('btnAnalyze');
  if(analyzeBtn) analyzeBtn.onclick = handleAnalyze;

  document.querySelectorAll('.check-item').forEach(el=>{
    el.onclick = ()=>{
      const box = el.querySelector('.check-box');
      const text = el.querySelector('.check-text');
      const on = box.classList.toggle('on');
      text.classList.toggle('on', on);
    };
  });

  const pitchToggle = document.getElementById('pitchToggle');
  if(pitchToggle){
    pitchToggle.onclick = ()=>{
      const body = document.getElementById('pitchBody');
      const chev = document.getElementById('pitchChevron');
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      chev.classList.toggle('open', !open);
    };
  }
  const copyBtn = document.getElementById('copyBtn');
  if(copyBtn){
    copyBtn.onclick = ()=>{
      const text = state.report.draft_application_angle;
      const done = ()=>{
        copyBtn.innerHTML = icon('check',15);
        copyBtn.classList.add('copied');
        setTimeout(()=>{ copyBtn.innerHTML = icon('copy',15); copyBtn.classList.remove('copied'); }, 1800);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=>{});
      }
    };
  }
}

function setFile(kind, file){
  if(kind==="candidate") state.candidateFileName = file.name; else state.opportunityFileName = file.name;
  if(state.activePresetId) state.activePresetId = null;
  render();
}

function updateAnalyzeButton(){
  const btn = document.getElementById('btnAnalyze');
  if(!btn) return;
  const disabled = !canSubmit() || state.loading;
  btn.disabled = disabled;
  const hint = document.querySelector('.analyze-hint');
  if(!canSubmit() && !hint){
    btn.insertAdjacentHTML('afterend', '<p class="analyze-hint">Add a candidate profile and an opportunity description to continue.</p>');
  } else if(canSubmit() && hint){
    hint.remove();
  }
}

function handleAnalyze(){
  if(!canSubmit() || state.loading) return;
  state.loading = true;
  state.error = null;
  state.report = null;
  render();

  setTimeout(()=>{
    try{
      const preset = state.activePresetId ? DEMO_PRESETS.find(p=>p.id===state.activePresetId) : null;
      if(preset){
        state.report = preset.report;
        state.isPresetReport = true;
      } else {
        state.report = analyzeFreeform(state.candidateText, state.opportunityText);
        state.isPresetReport = false;
      }
    } catch(err){
      state.error = "Something went wrong generating the analysis. Please try again.";
    } finally{
      state.loading = false;
      render();
    }
  }, 1400);
}

/* gauge fill animation via CSS custom property trick */
const styleTag = document.createElement('style');
styleTag.textContent = '@keyframes gaugeFill { to { stroke-dashoffset: var(--gauge-offset); } }';
document.head.appendChild(styleTag);

render();
</script>
</body>
</html>
